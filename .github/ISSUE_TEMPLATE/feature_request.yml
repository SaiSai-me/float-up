name: Feature request
description: Suggest a focused improvement to Float Up.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the user-facing outcome rather than only an implementation detail.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reusable component
        - Automatic layout
        - Playground editor
        - Export and documentation
    validations:
      required: true
